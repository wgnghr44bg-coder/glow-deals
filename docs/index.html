<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beauty Budget</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<meta name="description" content="De laagste prijzen voor Charlotte Tilbury make-up, te bestellen naar Nederland.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hedvig+Letters+Serif:opsz@12..24&family=Geist:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Hallmark · shape: app screen · genre: editorial · theme: Studio (deal 1/3, seed price-comparison-beauty-brand-cf71·1102ec80·2026-11-12·r0) · redesign: full
 * nav: a tab row under the wordmark, kept · signature: the price ledger, the cheapest price set large in Hedvig with every other shop ruled beneath it · states: loading, empty, error, full
 * axes: light/roman-serif/warm · posture: restrained · contrast: pass · v2.0.0 */
/* Hallmark · pre-emit critique: P4 H5 E4 S4 R4 V4 · weakest: P, a price list has little to argue; the argument is the order: cheapest first, set big, the rest ruled small beneath */
/* Hallmark · dropped dark mode · the Studio ground is a cool light proof; one scheme */
/* Hallmark · dropped "✨" and "🚗" · 30a names emoji as icons; the car became the words "ophalen over de grens" */
@import url("./tokens.css");
@import url("./base.css");

:root { --container: 1040px; --shop-col: 7.5rem; }

/* De kop: woordmerk op het proefvel (stippenraster), vervaagt naar het schone papier. */
.mast { position: relative; isolation: isolate; padding-block: var(--space-xl) var(--space-lg); }
.mast::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background-image: radial-gradient(circle at 1px 1px, var(--color-dot) 1px, transparent 1.4px); background-size: 24px 24px;
  -webkit-mask-image: linear-gradient(to bottom, var(--color-ink) 50%, transparent); mask-image: linear-gradient(to bottom, var(--color-ink) 50%, transparent); }
.merk { display: flex; align-items: center; gap: var(--space-md); }
.merk h1 { flex: 1 1 auto; min-width: 0; }
.logo { flex: none; width: clamp(2.5rem, 7vw, 3.75rem); height: auto; }
.mast h1 { font-size: clamp(2.25rem, 9vw, 4.5rem); line-height: 1; max-width: none; }
.mast .guide { height: var(--rule-hair); background: var(--color-accent); margin-top: var(--space-xs); max-width: 22rem; }
.mast p { margin-top: var(--space-md); color: var(--color-ink-2); max-width: 46ch; }
.mast .stand { margin-top: var(--space-xs); font-size: var(--text-sm); color: var(--color-muted); font-variant-numeric: tabular-nums; }

/* Tabs: een gewone tabrij, scrollt opzij op smalle schermen. */
.tabs { display: flex; gap: var(--space-lg); border-bottom: var(--rule-hair) solid var(--color-ink); overflow-x: auto; scrollbar-width: none; }
.tab { appearance: none; background: none; border: 0; padding: var(--space-sm) 0; min-height: 44px; color: var(--color-muted); font-weight: 500; font-size: var(--text-md); white-space: nowrap; cursor: pointer;
  box-shadow: inset 0 -2px 0 transparent; transition: color var(--dur-short) var(--ease-out), box-shadow var(--dur-short) var(--ease-out); }
.tab:hover { color: var(--color-ink); }
.tab:active { color: var(--color-ink-2); }
.tab:focus-visible { outline: 2px solid var(--color-focus); outline-offset: -2px; }
.tab[aria-selected="true"] { color: var(--color-ink); box-shadow: inset 0 -2px 0 var(--color-accent); }

main { padding-block: var(--space-lg) var(--space-2xl); }
.uitleg { color: var(--color-muted); font-size: var(--text-sm); margin-bottom: var(--space-md); }

/* Het grootboek: per product één regel, de laagste prijs groot. */
.product { display: grid; grid-template-columns: 88px minmax(0, 1fr) auto; gap: var(--space-xs) var(--space-lg); align-items: start;
  padding-block: var(--space-lg); border-top: var(--rule-hair) solid var(--color-ink); }
.product + .product { border-top-color: var(--color-rule); }
/* De snijtekens vallen in de kolomafstand, nooit over de tekst. */
.foto { position: relative; width: 88px; height: 88px; margin-top: var(--space-xs); }
.foto img { width: 100%; height: 100%; object-fit: contain; background: var(--color-paper-hi); border-radius: var(--radius-card); }
.foto::before { content: ""; position: absolute; inset: calc(-1 * var(--space-xs)); pointer-events: none;
  background:
    linear-gradient(var(--color-mark), var(--color-mark)) 0 0 / 6px 1px no-repeat,
    linear-gradient(var(--color-mark), var(--color-mark)) 0 0 / 1px 6px no-repeat,
    linear-gradient(var(--color-mark), var(--color-mark)) 100% 0 / 6px 1px no-repeat,
    linear-gradient(var(--color-mark), var(--color-mark)) 100% 0 / 1px 6px no-repeat,
    linear-gradient(var(--color-mark), var(--color-mark)) 0 100% / 6px 1px no-repeat,
    linear-gradient(var(--color-mark), var(--color-mark)) 0 100% / 1px 6px no-repeat,
    linear-gradient(var(--color-mark), var(--color-mark)) 100% 100% / 6px 1px no-repeat,
    linear-gradient(var(--color-mark), var(--color-mark)) 100% 100% / 1px 6px no-repeat; }
.foto--leeg { background: var(--color-paper-2); border-radius: var(--radius-card); }
.product h2 { font-size: var(--text-xl); line-height: 1.15; letter-spacing: -0.005em; max-width: none; }
.waar { margin-top: var(--space-2xs); color: var(--color-ink-2); font-size: var(--text-sm); }
.waar strong { font-weight: 500; color: var(--color-ink); }
.let { color: var(--color-muted); }
.prijs { text-align: right; font-variant-numeric: tabular-nums; }
.prijs .bedrag { font-family: var(--font-display); font-size: var(--text-3xl); line-height: 1; letter-spacing: var(--tracking-display); color: var(--color-ink); white-space: nowrap; }
.prijs .was { display: block; margin-top: var(--space-2xs); font-size: var(--text-sm); color: var(--color-muted); }
.prijs .was s { text-decoration-thickness: 1px; }
.acties { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: var(--space-xs) var(--space-lg); align-items: center; margin-top: var(--space-xs); }

/* Knoppen: één gevulde actie per product, de rest typografisch. */
.btn { position: relative; display: inline-flex; align-items: center; min-height: 44px; padding: 0 var(--space-md); border: var(--rule-hair) solid var(--color-ink); border-radius: 2px;
  background: var(--color-accent); color: var(--color-accent-ink); font-weight: 500; font-size: var(--text-sm); text-decoration: none; cursor: pointer;
  transition: background-color var(--dur-short) var(--ease-out), transform var(--dur-micro) var(--ease-out); }
.btn::after { content: ""; position: absolute; inset: 2px; border: var(--rule-hair) solid var(--color-mark); border-radius: 1px; pointer-events: none; }
.btn:hover { background: color-mix(in oklab, var(--color-accent) 86%, var(--color-ink)); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

details { grid-column: 2 / -1; }
summary { display: inline-flex; align-items: center; min-height: 44px; color: var(--color-ink-2); font-size: var(--text-sm); font-weight: 500; cursor: pointer;
  text-decoration: underline; text-decoration-color: var(--color-rule); text-underline-offset: 0.2em; transition: text-decoration-color var(--dur-short) var(--ease-out); }
summary:hover { text-decoration-color: var(--color-accent); }
summary:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

/* De andere winkels: een kleine tabel, alleen horizontale lijnen. */
.rest { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
.rest td { padding: var(--space-xs) 0; border-top: var(--rule-hair) solid var(--color-rule); vertical-align: top; }
.rest td:first-child { width: var(--shop-col); color: var(--color-ink); font-weight: 500; padding-right: var(--space-sm); }
.rest td:last-child { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; padding-left: var(--space-sm); }
.rest a { color: var(--color-ink-2); text-decoration-color: var(--color-rule); }
.rest a:hover { text-decoration-color: var(--color-accent); }

.zelf { list-style: none; margin: 0; padding: 0; columns: 2 12rem; column-gap: var(--space-lg); font-size: var(--text-sm); }
.zelf li { break-inside: avoid; padding-block: var(--space-2xs); }
.zelf a { color: var(--color-ink); text-decoration-color: var(--color-rule); }
.zelf a:hover { text-decoration-color: var(--color-accent); }
.zelf .over { color: var(--color-muted); }
.kop-klein { margin: var(--space-sm) 0 var(--space-2xs); font-size: var(--text-sm); color: var(--color-muted); font-weight: 500; }

.btn:disabled, .tab:disabled, select:disabled, .veld:disabled, .vink input:disabled { opacity: 0.55; cursor: not-allowed; }
a:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

/* Alle aanbiedingen: zoekveld en filters boven een raster van producten. */
.balk { display: flex; flex-wrap: wrap; gap: var(--space-sm); align-items: center; margin-bottom: var(--space-lg); }
.veld { flex: 1 1 18rem; min-height: 44px; padding: 0 var(--space-sm); border: var(--rule-hair) solid var(--color-muted); border-radius: var(--radius-card); background: var(--color-paper-hi); color: var(--color-ink); font-size: var(--text-md); }
.veld::placeholder { color: var(--color-muted); }
.veld:focus-visible, select:focus-visible { outline: 2px solid var(--color-focus); outline-offset: -2px; }
select { min-height: 44px; padding: 0 var(--space-sm); border: var(--rule-hair) solid var(--color-muted); border-radius: var(--radius-card); background: var(--color-paper-hi); color: var(--color-ink); font-size: var(--text-sm); cursor: pointer; }
.vink { display: inline-flex; align-items: center; gap: var(--space-xs); min-height: 44px; font-size: var(--text-sm); color: var(--color-ink-2); cursor: pointer; }
.vink input { width: 18px; height: 18px; margin: 0; accent-color: var(--color-ink); cursor: pointer; }
.vink input:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

.raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 14rem), 1fr)); gap: var(--space-xl) var(--space-lg); }
.tegel { display: flex; flex-direction: column; gap: var(--space-xs); border-top: var(--rule-hair) solid var(--color-ink); padding-top: var(--space-md); }
.tegel .foto { width: auto; height: 180px; margin: var(--space-xs); margin-bottom: var(--space-sm); }
.tegel h2 { font-size: var(--text-lg); line-height: 1.2; letter-spacing: -0.005em; flex: 1; max-width: none; }
.tegel .regel { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-sm); }
.tegel .bedrag { font-family: var(--font-display); font-size: var(--text-2xl); line-height: 1; font-variant-numeric: tabular-nums; }
.tegel .was { font-size: var(--text-sm); color: var(--color-muted); }
.tegel .winkel { font-size: var(--text-sm); color: var(--color-ink-2); }
.tegel a.naam { color: inherit; text-decoration: none; }
.tegel a.naam:hover h2 { text-decoration: underline; text-decoration-color: var(--color-accent); text-decoration-thickness: 1px; }

/* Winkels & kosten */
.tekst { max-width: 62ch; }
.tekst h2 { font-size: var(--text-2xl); margin: var(--space-xl) 0 var(--space-sm); }
.tekst h2:first-child { margin-top: 0; }
.tekst p { color: var(--color-ink-2); }
.tekst p + p { margin-top: var(--space-sm); }
.winkels { width: 100%; border-collapse: collapse; margin-top: var(--space-sm); font-size: var(--text-sm); }
.winkels th { text-align: left; font-weight: 500; color: var(--color-muted); padding: var(--space-xs) var(--space-sm) var(--space-xs) 0; border-bottom: var(--rule-hair) solid var(--color-ink); white-space: nowrap; }
.winkels td { padding: var(--space-sm) var(--space-sm) var(--space-sm) 0; border-bottom: var(--rule-hair) solid var(--color-rule); vertical-align: top; color: var(--color-ink-2); }
.winkels td:first-child { color: var(--color-ink); font-weight: 500; }
.winkels .num { white-space: nowrap; }
.fout { color: var(--color-error); }

/* Laden, leeg en fout */
.laden .product { opacity: 1; }
.blok { display: block; background: var(--color-paper-2); border-radius: var(--radius-card); }
.status { padding: var(--space-2xl) 0; color: var(--color-ink-2); border-top: var(--rule-hair) solid var(--color-ink); }

footer { padding-block: var(--space-xl); border-top: var(--rule-hair) solid var(--color-rule); color: var(--color-muted); font-size: var(--text-sm); }
footer p + p { margin-top: var(--space-xs); }

@media (max-width: 40rem) {
  .product { grid-template-columns: 64px minmax(0, 1fr); column-gap: var(--space-md); }
  .foto { width: 64px; height: 64px; }
  .prijs { grid-column: 2; text-align: left; }
  .acties, details { grid-column: 1 / -1; }
  .product h2 { font-size: var(--text-lg); }
  .winkels thead { display: none; }
  .winkels tr { display: block; padding-block: var(--space-sm); border-bottom: var(--rule-hair) solid var(--color-rule); }
  .winkels td { display: block; border: 0; padding: var(--space-3xs) 0; }
}
</style>
</head>
<body>
<header class="mast">
  <div class="container">
    <div class="merk">
    <svg class="logo" viewBox="0 0 48 64" width="48" height="64" aria-hidden="true" focusable="false">
      <circle cx="24" cy="22" r="18" fill="var(--color-paper-hi)" stroke="var(--color-ink)" stroke-width="2.5"/>
      <circle cx="24" cy="22" r="13.5" fill="none" stroke="var(--color-ink)" stroke-width="1" opacity=".35"/>
      <path d="M30 15.5a8 8 0 1 0 0 13" fill="none" stroke="var(--color-accent)" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M16.5 20h10M16.5 24.5h9" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round"/>
      <path d="M24 40v18" stroke="var(--color-ink)" stroke-width="5" stroke-linecap="round"/>
      <circle cx="24" cy="40.5" r="3.5" fill="var(--color-ink)"/>
    </svg>
    <h1>Beauty Budget</h1>
    </div>
    <div class="guide" aria-hidden="true"></div>
    <p>De laagste prijzen voor Charlotte Tilbury, te bestellen naar Nederland.</p>
    <p class="stand" id="tijd"></p>
  </div>
</header>

<div class="container">
  <div class="tabs" role="tablist" aria-label="Weergave">
    <button class="tab" type="button" role="tab" aria-selected="true" aria-controls="vergelijk" data-tab="vergelijk">Bestsellers vergelijken</button>
    <button class="tab" type="button" role="tab" aria-selected="false" aria-controls="alles" data-tab="alles">Alle aanbiedingen</button>
    <button class="tab" type="button" role="tab" aria-selected="false" aria-controls="winkels" data-tab="winkels">Winkels &amp; kosten</button>
  </div>
</div>

<main class="container">
  <section id="vergelijk" role="tabpanel" aria-label="Bestsellers vergelijken">
    <div class="laden" aria-busy="true" aria-label="Prijzen laden">
      <div class="product"><span class="blok" style="width:88px;height:88px"></span><span><span class="blok" style="height:1.4rem;width:60%"></span><span class="blok" style="height:0.9rem;width:40%;margin-top:8px"></span></span><span class="blok" style="height:2rem;width:5rem"></span></div>
      <div class="product"><span class="blok" style="width:88px;height:88px"></span><span><span class="blok" style="height:1.4rem;width:50%"></span><span class="blok" style="height:0.9rem;width:35%;margin-top:8px"></span></span><span class="blok" style="height:2rem;width:5rem"></span></div>
    </div>
    <noscript><p class="status">Deze pagina heeft JavaScript nodig om de prijzen te tonen.</p></noscript>
  </section>

  <section id="alles" role="tabpanel" aria-label="Alle aanbiedingen" hidden>
    <div class="balk">
      <label class="visually-hidden" for="zoek">Zoeken</label>
      <input class="veld" id="zoek" type="search" name="zoek" autocomplete="off" placeholder="Zoek, bv. pillow talk, magic cream, blush">
      <label class="visually-hidden" for="sorteer">Sorteren</label>
      <select id="sorteer" name="sorteer">
        <option value="korting">Grootste korting eerst</option>
        <option value="laag">Laagste prijs eerst</option>
        <option value="hoog">Hoogste prijs eerst</option>
      </select>
      <label class="vink"><input type="checkbox" id="alleenEU" checked> Alleen EU (geen invoerkosten)</label>
      <label class="vink"><input type="checkbox" id="alleenKorting"> Alleen met korting</label>
    </div>
    <div class="raster" id="lijst"></div>
  </section>

  <section id="winkels" role="tabpanel" aria-label="Winkels en kosten" hidden></section>
</main>

<footer>
  <div class="container">
    <p>Prijzen worden elke dag automatisch opgehaald en kunnen intussen veranderd zijn: controleer de prijs altijd in de winkel zelf.</p>
    <p>Deze site is niet verbonden aan Charlotte Tilbury of aan de genoemde winkels.</p>
  </div>
</footer>

<script>
// Bestsellers om te vergelijken. 'zoek' moet in de naam staan, 'niet' juist niet (sets, mini's en navullingen tellen apart).
const BESTSELLERS = [
  {naam:"Charlotte's Magic Cream (50 ml)", maat:/\b50\s?ml/i, zoek:/magic cream/i, niet:/\b(night|eye|mini|travel|kit|navulling|forever|body|set|duo|trio|refill|navul|wonderland|secret|routine)\b/i},
  {naam:"Airbrush Flawless Setting Spray (100 ml)", maat:/\b100\s?ml\b/i, zoek:/setting spray/i, niet:/\b(mini|kit|duo|set|trio)\b/i},
  {naam:"Airbrush Flawless Finish (poeder)", zoek:/flawless finish/i, niet:/\b(brightening|refill|navul|kit|set|mini)\b/i},
  {naam:"Hollywood Flawless Filter", zoek:/flawless filter/i, niet:/\b(mini|kit|set|duo|trio)\b/i},
  {naam:"Beautiful Skin Foundation", zoek:/beautiful skin foundation/i, niet:/\b(kit|set)\b/i},
  {naam:"Airbrush Flawless Foundation", zoek:/airbrush flawless foundation|^charlotte tilbury airbrush flawless$/i, niet:/\b(kit|set|mini)\b/i},
  {naam:"Magic Away Concealer", zoek:/magic away/i, niet:/\b(kit|set)\b/i},
  {naam:"Pillow Talk Lip Cheat (lippotlood)", zoek:/lip cheat/i, niet:/\b(kit|set|duo|mini|trio)\b/i},
  {naam:"Matte Revolution lippenstift", zoek:/matte revolution/i, niet:/\b(kit|set|duo|mini|trio|refill|navul)\b/i},
  {naam:"K.I.S.S.I.N.G lippenstift", zoek:/k\.?i\.?s\.?s\.?i\.?n\.?g/i, niet:/\b(kit|set|mini|trio)\b/i},
  {naam:"Collagen Lip Bath", zoek:/lip bath/i, niet:/\b(kit|set|duo|mini|trio)\b/i},
  {naam:"Lip Lustre (lipgloss)", zoek:/lip lustre/i, niet:/\b(kit|set|duo|mini|trio)\b/i},
  {naam:"Pillow Talk Lip & Cheek Glow", zoek:/lip and cheek glow|lip & cheek glow|lip \+ cheek glow/i, niet:/\b(kit|set|duo|mini|trio)\b/i},
  {naam:"Beauty Light Wand (highlighter)", zoek:/beauty light wand/i, niet:/\b(kit|set|duo|mini|trio)\b/i},
  {naam:"Matte Beauty Blush Wand", zoek:/blush wand/i, niet:/\b(kit|set|duo|mini|trio)\b/i},
  {naam:"Hollywood Contour Wand", zoek:/contour wand/i, niet:/\b(kit|set|duo|mini|trio)\b/i},
  {naam:"Unreal Blush", zoek:/unreal blush/i, niet:/\b(kit|set|duo|mini|trio)\b/i},
  {naam:"Cheek to Chic blush", zoek:/cheek to chic/i, niet:/\b(kit|set|duo|mini|trio)\b/i},
  {naam:"Pillow Talk Push Up Lashes (mascara)", zoek:/push up lashes/i, niet:/\b(kit|set|duo|mini|trio)\b/i},
  {naam:"Luxury Palette (oogschaduw)", zoek:/luxury palette/i, niet:/\b(kit|set)\b/i},
  {naam:"Magic Serum Crystal Elixir", zoek:/magic serum/i, niet:/\b(kit|set|mini|duo)\b/i},
];

// Mini's, reisformaten, navullingen en sets zijn een ander product: die tellen nooit mee bij het vergelijken.
const GEEN = /\b(mini|travel|refill|navulling|kit|set|duo|trio|bundle|wonderland)\b/i;

// Winkels die geen automatisch ophalen toelaten: hier kijk je zelf, met de productnaam al ingevuld.
// 'nl' = levert in Nederland; 'rijden' = Belgische/Duitse winkel, levert mogelijk niet naar NL (ophalen of pakketpunt over de grens).
const ZELF_KIJKEN = [
  ["Douglas", "nl", q=>`https://www.douglas.nl/nl/search?q=${q}`],
  ["ICI Paris XL", "nl", q=>`https://www.iciparisxl.nl/search?text=${q}`],
  ["de Bijenkorf", "nl", q=>`https://www.debijenkorf.nl/zoeken?query=${q}`],
  ["bol", "nl", q=>`https://www.bol.com/nl/nl/s/?searchtext=${q}`],
  ["Zalando", "nl", q=>`https://www.zalando.nl/catalogus/?q=${q}`],
  ["Lookfantastic", "nl", q=>`https://www.lookfantastic.nl/search?q=${q}`],
  ["Douglas België", "rijden", q=>`https://www.douglas.be/nl/search?q=${q}`],
  ["Douglas Duitsland", "rijden", q=>`https://www.douglas.de/de/search?q=${q}`],
  ["Sephora Duitsland", "rijden", q=>`https://www.sephora.de/search?q=${q}`],
  ["Niche Beauty (DE)", "rijden", q=>`https://www.niche-beauty.com/de-de/search?q=${q}`],
];

const BTW = 1.21;  // invoer-btw bij bestellen buiten de EU
let DATA = null, AANBOD = [];

const euro = n => "€ " + n.toFixed(2).replace(".", ",");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const kortNaam = s => s.replace(/^charlotte tilbury,?\s*/i, "");
const nieuwVenster = 'target="_blank" rel="noopener"';

function bereken(d){
  const uit = [];
  for (const [sleutel, w] of Object.entries(d.winkels)) {
    for (const it of w.items) {
      const k = d.koersen[it.munt] ?? 1;
      const eur = it.prijs * k, was = it.was ? it.was * k : null;
      uit.push({...it, winkel: w.naam, sleutel, eu: w.eu, land: w.land,
        eur, was: was && was > eur ? was : null,
        nl: w.eu ? eur : eur * BTW,                      // geschatte prijs in NL (buiten EU + btw)
        korting: was && was > eur ? Math.round((1 - eur / was) * 100) : 0});
    }
  }
  return uit;
}

function foto(src, klas = "foto"){
  return src ? `<div class="${klas}"><img src="${esc(src)}" alt="" loading="lazy" width="300" height="300"></div>`
             : `<div class="${klas} foto--leeg" aria-hidden="true"></div>`;
}

function zelfKijken(q){
  const lijst = soort => ZELF_KIJKEN.filter(z => z[1] === soort)
    .map(([n, , f]) => `<li><a href="${f(q)}" ${nieuwVenster}>${n}</a></li>`).join("");
  return `<p class="kop-klein">Levert in Nederland</p><ul class="zelf">${lijst("nl")}</ul>
    <p class="kop-klein">Ophalen over de grens (levert niet altijd in Nederland)</p><ul class="zelf">${lijst("rijden")}</ul>`;
}

function toonVergelijk(){
  const html = BESTSELLERS.map(b => {
    // Staat er een inhoud in de naam die niet de gevraagde maat is (bv. 15 ml i.p.v. 50 ml), dan telt hij niet mee.
    const goedeMaat = a => !b.maat || b.maat.test(a.naam) || !/\d+\s?(ml|g)\b/i.test(a.naam);
    const treffers = AANBOD.filter(a => b.zoek.test(a.naam) && !b.niet.test(a.naam) && !GEEN.test(a.naam) && goedeMaat(a) && a.voorraad !== false)
                           .sort((x, y) => x.nl - y.nl);
    const q = encodeURIComponent("Charlotte Tilbury " + b.naam.replace(/\(.*\)/, "").trim());
    const zelf = `<details><summary>Zelf kijken bij andere winkels</summary>${zelfKijken(q)}</details>`;
    if (!treffers.length) return `<article class="product">${foto(null)}
        <div><h2>${esc(b.naam)}</h2><p class="waar">Nu bij geen van de automatische winkels gevonden.</p></div>
        <div class="prijs"></div>${zelf}</article>`;
    const t = treffers[0];
    const rest = treffers.slice(1, 8).map(a => `<tr><td>${esc(a.winkel)}</td>
        <td><a href="${esc(a.url)}" ${nieuwVenster}>${esc(kortNaam(a.naam))}</a></td>
        <td>${euro(a.eur)}${a.eu ? "" : `<br><span class="let">+ invoerkosten</span>`}</td></tr>`).join("");
    return `<article class="product">${foto(t.img)}
      <div>
        <h2>${esc(b.naam)}</h2>
        <p class="waar">Goedkoopst bij <strong>${esc(t.winkel)}</strong>: ${esc(kortNaam(t.naam))}</p>
        ${t.eu ? "" : `<p class="waar let">Let op: buiten de EU komen btw en invoerkosten erbij, samen ongeveer ${euro(t.nl)}.</p>`}
      </div>
      <div class="prijs"><span class="bedrag">${euro(t.eur)}</span>${t.was ? `<span class="was"><s>${euro(t.was)}</s>, ${t.korting}% korting</span>` : ""}</div>
      <div class="acties"><a class="btn" href="${esc(t.url)}" ${nieuwVenster}>Bekijk bij ${esc(t.winkel)}</a></div>
      ${rest ? `<details><summary>Ook bij ${treffers.length - 1} andere aanbieding(en)</summary><table class="rest"><tbody>${rest}</tbody></table></details>` : ""}
      ${zelf}</article>`;
  }).join("");
  document.getElementById("vergelijk").innerHTML =
    `<p class="uitleg">Per product de laagste prijs die nu gevonden is. Let op: de inhoud (ml/gram) of kleur kan per winkel verschillen.</p>` + html;
}

function toonAlles(){
  const q = document.getElementById("zoek").value.trim().toLowerCase();
  const eu = document.getElementById("alleenEU").checked;
  const kort = document.getElementById("alleenKorting").checked;
  const sort = document.getElementById("sorteer").value;
  let l = AANBOD.filter(a => (!q || a.naam.toLowerCase().includes(q)) && (!eu || a.eu) && (!kort || a.korting > 0));
  l.sort(sort === "laag" ? (x, y) => x.nl - y.nl : sort === "hoog" ? (x, y) => y.nl - x.nl
         : (x, y) => (y.korting - x.korting) || (x.nl - y.nl));
  document.getElementById("lijst").innerHTML = l.length ? l.slice(0, 300).map(a => `<article class="tegel">
      <a class="naam" href="${esc(a.url)}" ${nieuwVenster}>${foto(a.img)}<h2>${esc(kortNaam(a.naam))}</h2></a>
      <div class="regel"><span class="bedrag">${euro(a.eur)}</span>${a.was ? `<span class="was"><s>${euro(a.was)}</s>, ${a.korting}% korting</span>` : ""}</div>
      <p class="winkel">${esc(a.winkel)}${a.eu ? "" : `, plus invoerkosten`}</p></article>`).join("")
    : `<p class="status">Niets gevonden. Probeer een ander woord, of zet "Alleen EU" uit.</p>`;
}

function toonWinkels(){
  const rijen = Object.values(DATA.winkels).map(w => `<tr><td>${esc(w.naam)} (${esc(w.land)})</td>
      <td class="num">${w.items.length} producten<br>bijgewerkt ${w.bijgewerkt ? new Date(w.bijgewerkt).toLocaleString("nl-NL",{dateStyle:"short",timeStyle:"short"}) : "nog nooit"}
      ${w.fout ? `<br><span class="fout">Laatste keer ophalen mislukt, dit zijn de vorige prijzen.</span>` : ""}</td>
      <td>${esc(w.levering || "")}${w.eu ? "" : " Buiten de EU kost bestellen vaak 21% btw plus inklaringskosten."}</td></tr>`).join("");
  document.getElementById("winkels").innerHTML = `<div class="tekst">
    <h2>Winkels die automatisch worden bijgehouden</h2></div>
    <table class="winkels"><thead><tr><th>Winkel</th><th>Stand</th><th>Levering</th></tr></thead><tbody>${rijen}</tbody></table>
    <div class="tekst">
    <h2>Winkels om zelf te checken</h2>
    <p>Douglas, ICI Paris XL, de Bijenkorf, bol, Zalando en Lookfantastic laten automatisch ophalen niet toe.
    Bij elk product op "Bestsellers vergelijken" staan links om daar meteen te zoeken.</p>
    <p>Douglas België en Duitsland, Sephora Duitsland en Niche Beauty leveren niet altijd in Nederland.
    Dan kun je het ophalen in de winkel of laten sturen naar een pakketpunt net over de grens.</p>
    <h2>Goed om te weten</h2>
    <p>Prijzen in ponden en dollars zijn omgerekend met de wisselkoers van de ECB. Verzendkosten staan er niet bij: die verschillen per winkel en vervallen vaak boven een bepaald bedrag.</p>
    <p>Bestel je buiten de EU (VS, VK), dan betaal je in Nederland 21% btw en meestal ook inklaringskosten van de vervoerder.</p></div>`;
}

document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === t));
  ["vergelijk", "alles", "winkels"].forEach(id => document.getElementById(id).hidden = id !== t.dataset.tab);
});
["zoek", "alleenEU", "alleenKorting", "sorteer"].forEach(id => document.getElementById(id).addEventListener("input", toonAlles));

fetch("data.json", {cache: "no-store"}).then(r => r.json()).then(d => {
  DATA = d; AANBOD = bereken(d);
  document.getElementById("tijd").textContent = "Bijgewerkt: " +
    new Date(d.bijgewerkt).toLocaleString("nl-NL", {weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}) + ".";
  toonVergelijk(); toonAlles(); toonWinkels();
}).catch(() => {
  document.getElementById("vergelijk").innerHTML = `<p class="status">De prijzen konden niet geladen worden. Probeer het later opnieuw.</p>`;
});
</script>
</body>
</html>
